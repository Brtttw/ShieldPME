spring.application.name=shieldpme

# Configuracoes LOCAIS (senha do banco etc.). Esse arquivo NAO vai para o Git:
# copie application-local.properties.example para application-local.properties e preencha.
spring.config.import=optional:classpath:application-local.properties

# ---------- Banco de dados (SQL Server) ----------
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=ShieldPME;integratedSecurity=false;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
# A SENHA nao fica aqui. Defina spring.datasource.password em application-local.properties
# (ou a variavel de ambiente SPRING_DATASOURCE_PASSWORD).

# ---------- JPA / Hibernate ----------
#spring.jpa.show-sql=true
#spring.jpa.hibernate.format_sql=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.open-in-view = false

# Usa os nomes de tabelas/colunas exatamente como estao no SQL (sem converter para snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ---------- JWT (login) ----------
# Segredo para assinar o token (minimo 32 caracteres). Se ficar vazio, a API gera um segredo
# aleatorio a cada inicializacao (tudo funciona; so os logins anteriores deixam de valer ao reiniciar).
shieldpme.jwt.secret=${JWT_SECRET:}
# Validade do token, em horas
shieldpme.jwt.horas=8

# ---------- Login com Google ----------
# Client ID PUBLICO (o mesmo de VITE_GOOGLE_CLIENT_ID no .env do front). Nao e um segredo.
shieldpme.google.client-id=${GOOGLE_CLIENT_ID:171434987194-mlavqfsd9qmsr4pduhcmknholhul2e25.apps.googleusercontent.com}
